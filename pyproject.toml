[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-cli"
version = "0.1.0"
description = "A safe, controllable Steam CLI for the Hermes agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "steam>=1.4.4",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "keyring>=24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "respx>=0.21",
]

[project.scripts]
steam = "steam_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
