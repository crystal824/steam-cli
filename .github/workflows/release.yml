name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install release tools
        run: python -m pip install --upgrade build twine
      - name: Verify tag version
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          expected="${TAG_VERSION#v}"
          actual="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$expected" = "$actual"
      - name: Generate changelog
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
      - name: Build Python distributions
        run: python -m build --outdir dist/python
      - name: Build Hermes Skill archive
        run: python scripts/build_skill.py --output-dir dist/skill
      - name: Validate Python distributions
        run: python -m twine check dist/python/*
      - name: Publish Python distributions
        if: ${{ vars.PUBLISH_PYPI == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.git-cliff.outputs.content }}
          generate_release_notes: false
          files: |
            dist/python/*
            dist/skill/*

      # Keep CHANGELOG.md in the repository in sync with what git-cliff rendered
      # for this release, so nobody has to hand-maintain it. Runs last on purpose:
      # the build/publish steps above must operate on the tagged tree, whereas this
      # step switches the worktree to the default branch before committing.
      - name: Commit changelog to the default branch
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          cp CHANGELOG.md "$RUNNER_TEMP/CHANGELOG.generated.md"
          git fetch origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/CHANGELOG.generated.md" CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md is already up to date on main"
            exit 0
          fi
          git commit -m "chore(changelog): regenerate for ${GITHUB_REF_NAME}"
          git push origin HEAD:main
          echo "Committed the regenerated CHANGELOG.md to main"
